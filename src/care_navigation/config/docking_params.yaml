docking_server:
  ros__parameters:
    use_sim_time: true

    # Docking server behavior
    controller_frequency: 20.0
    initial_perception_timeout: 5.0
    dock_approach_timeout: 30.0
    max_retries: 3

    # Nav2 / TF frames
    base_frame: base_footprint
    fixed_frame: odom
    odom_topic: /odom
    dock_database: ""  # overridden at launch by care_nav2.launch.py

    # Dock instances are defined in docks.yaml. Each dock entry uses:
    #   type: care_tag_station
    # so this plugin block configures all AprilTag-backed stations.
    dock_plugins: ["care_tag_station"]

    care_tag_station:
      plugin: "opennav_docking::SimpleNonChargingDock"

      # These stations are not chargers; success means the robot is aligned
      # at the configured standoff pose.
      dock_direction: "forward"
      docking_threshold: 0.03
      use_battery_status: false
      use_stall_detection: false

      # The robot should begin precise docking from roughly 60 cm away.
      staging_x_offset: -0.60
      staging_yaw_offset: 0.0

      # AprilTag/external dock pose input.
      use_external_detection_pose: true
      external_detection_pose_topic: /detected_dock_pose
      external_detection_timeout: 1.0
      subscribe_toggle: false
      filter_coef: 0.1

      # Final standoff from the detected AprilTag.
      # This is set for a 10 cm stop distance. Flip the sign if testing shows
      # the robot targets the wrong side of the tag frame.
      external_detection_translation_x: -0.10
      external_detection_translation_y: 0.0
      external_detection_rotation_yaw: 0.0
      external_detection_rotation_pitch: 0.0
      external_detection_rotation_roll: 0.0
